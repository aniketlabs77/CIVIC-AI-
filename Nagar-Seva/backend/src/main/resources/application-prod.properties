# ===================================================================
# Production Profile Configuration for NagarSeva API
# Active when spring.profiles.active=prod
# ===================================================================

# Database Configuration (PostgreSQL in Production)
spring.datasource.url=${DATABASE_URL}

# JPA / Hibernate Production Settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Production Logging Levels
logging.level.root=INFO
logging.level.com.nagarseva=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# AI Configuration - Google Gemini (Required in Prod)
app.gemini.api-key=${GEMINI_API_KEY}

# Firebase Configuration (Required in Prod)
app.firebase.service-account-path=${FIREBASE_CREDENTIALS_PATH}

# Rate Limiting in Production
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=5
