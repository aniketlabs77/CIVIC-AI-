# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=nagarseva-api

# Database Configuration - PostgreSQL when DATABASE_URL is set, otherwise H2 for local dev
# DATABASE_URL format: postgresql://user:password@host:port/database
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nagarsevadb}
# Let Spring Boot deduce driver class from URL; do not override
# spring.datasource.driverClassName=${DATABASE_URL:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# H2 Console (only for H2) - enable via SPRING_H2_CONSOLE_ENABLED=true when using H2 locally
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Enable Scheduling
spring.task.scheduling.pool.size=2

# AI Configuration (API key from environment variable GROQ_API_KEY)
# Escalation threshold in minutes (5 minutes for demo, represents X days in production)
app.escalation.threshold-minutes=5

# CORS Configuration - reads from FRONTEND_URL env var, defaults to allow all
app.cors.allowed-origins=${FRONTEND_URL:*}

# Logging
logging.level.root=INFO
logging.level.com.nagarseva=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always