# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name & Profiles
spring.application.name=nagarseva-api
spring.profiles.default=dev

# Database Configuration - PostgreSQL when DATABASE_URL is set, otherwise H2 for local dev
# DATABASE_URL format: postgresql://user:password@host:port/database
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nagarsevadb}
# Let Spring Boot deduce driver class from URL; do not override
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${firebase.project.id:nagar-seva-hackathon}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

# Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# H2 Console (only for H2) - accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable Scheduling
spring.task.scheduling.pool.size=2

# AI Configuration - Google Gemini (API key from environment variable GEMINI_API_KEY)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# Escalation threshold in minutes (5 minutes for demo, represents X days in production)
app.escalation.threshold-minutes=5

# Rate Limiting Configuration (POST /api/complaints)
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=5

# Firebase Configuration
# Path to service-account JSON (from FIREBASE_CREDENTIALS_PATH env var or default file)
app.firebase.service-account-path=${FIREBASE_CREDENTIALS_PATH:serviceAccountKey.json}

# CORS Configuration - reads from FRONTEND_URL env var, defaults to standard local dev origins
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Logging
logging.level.root=INFO
logging.level.com.nagarseva=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
